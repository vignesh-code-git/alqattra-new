<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 92" width="240" height="92" role="img" aria-label="Al Qattara Pure Drinking Water">
  <title>Al Qattara</title>
  <defs>
    <linearGradient id="aqGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4E9B35"/>
      <stop offset="55%" stop-color="#62A849"/>
      <stop offset="100%" stop-color="#4E9B35"/>
    </linearGradient>
    <linearGradient id="aqWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7FC6EC"/>
      <stop offset="50%" stop-color="#45A6DD"/>
      <stop offset="100%" stop-color="#8ACDF0"/>
    </linearGradient>
  </defs>

  <!-- palm tree -->
  <g fill="#4E9B35">
    <path d="M33 26c-6-7-15-9-21-5 7-1 12 1 16 5-5-1-10 1-13 5 5-3 10-3 14 0-4 1-7 4-8 8 3-4 7-6 11-5l1 1z"/>
    <path d="M34 25c3-8 11-13 18-12-6 2-10 6-12 11 4-3 9-4 13-2-5 0-9 2-12 6 4-1 8 0 11 3-4-2-8-2-11 0l-6-2z"/>
    <path d="M33 24c-1-6 2-12 7-15-3 4-4 9-3 13 2-3 5-5 9-5-4 2-6 5-7 9l-6-2z"/>
    <path d="M35 28c-1 12-4 23-10 33l5 1c5-11 7-22 8-34z"/>
  </g>

  <!-- arabic wordmark -->
  <text x="118" y="33" text-anchor="middle"
        font-family="'Segoe UI', 'Tahoma', 'Arial', sans-serif"
        font-size="25" font-weight="700" fill="#1C3668"
        letter-spacing="0.5">القطارة</text>

  <!-- latin wordmark -->
  <text x="118" y="60" text-anchor="middle"
        font-family="'Trebuchet MS', 'Verdana', 'Helvetica Neue', Arial, sans-serif"
        font-size="27" font-weight="700" font-style="italic" fill="#1C3668"
        letter-spacing="-0.4">Al Qattara</text>

  <!-- green dune -->
  <path d="M14 70c18 9 44 12 76 9 32-3 68-10 98-20-26 15-62 24-96 27-30 3-58 0-78-8z" fill="url(#aqGreen)"/>

  <!-- blue wave -->
  <path d="M34 80c22 8 52 9 84 4 29-5 56-13 76-22-18 13-44 23-73 28-33 6-64 3-87-10z" fill="url(#aqWave)"/>

  <!-- tagline -->
  <text x="124" y="90" text-anchor="middle"
        font-family="'Segoe UI', Tahoma, Arial, sans-serif"
        font-size="7" font-weight="600" fill="#45A6DD"
        letter-spacing="0.6">PURE DRINKING WATER</text>
</svg>
