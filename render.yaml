services:
  # Django Web Service on Render
  - type: web
    name: alqattara-crm-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "true"
      # Point to your PostgreSQL database (Render Managed Postgres, Supabase, Neon, etc.)
      - key: DATABASE_URL
        fromDatabase:
          name: alqattara-crm-postgres
          property: connectionString

databases:
  # Managed PostgreSQL on Render (Optional if you use external database)
  - name: alqattara-crm-postgres
    plan: free
    databaseName: alqattara_db
    user: alqattara
